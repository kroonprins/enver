contexts:
  - configmap-only
  - secret-only
  - deployment
  - statefulset
  - daemonset
  - container
  - variable-filter
  - clear-test
  - all

executions:
  - name: configmap-test
    output:
      name: configmap.env
      directory: output/configmap-test
    kube-context: kind-kind
    contexts:
      - configmap-only
  - name: secret-test
    output:
      name: secret.env
      directory: output/secret-test
    kube-context: kind-kind
    contexts:
      - secret-only
  - name: deployment-test
    output:
      name: deployment.env
      directory: output/deployment-test
    kube-context: kind-kind
    contexts:
      - deployment
  - name: statefulset-test
    output:
      name: statefulset.env
      directory: output/statefulset-test
    kube-context: kind-kind
    contexts:
      - statefulset
  - name: daemonset-test
    output:
      name: daemonset.env
      directory: output/daemonset-test
    kube-context: kind-kind
    contexts:
      - daemonset
  - name: container-test
    output:
      name: container.env
      directory: output/container-test
    kube-context: kind-kind
    contexts:
      - container
  - name: variable-filter-test
    output:
      name: variable-filter.env
      directory: output/variable-filter-test
    kube-context: kind-kind
    contexts:
      - variable-filter
  - name: clear-true-test
    output:
      name: clear-true.env
      directory: output/clear-true-test
      clear: true
    kube-context: kind-kind
    contexts:
      - clear-test
  - name: clear-false-test
    output:
      name: clear-false.env
      directory: output/clear-false-test
      clear: false
    kube-context: kind-kind
    contexts:
      - clear-test
  - name: all-test
    output:
      name: all.env
      directory: output/all-test
    kube-context: kind-kind
    contexts:
      - all

sources:
  - type: ConfigMap
    name: e2e-configmap
    namespace: enver-e2e-test
    contexts:
      include:
        - configmap-only
        - all

  - type: Secret
    name: e2e-secret
    namespace: enver-e2e-test
    contexts:
      include:
        - secret-only
        - all

  - type: Deployment
    name: e2e-deployment
    namespace: enver-e2e-test
    containers:
      - main
    volumeMountKeyMappings:
      - kind: ConfigMap
        name: e2e-file-configmap
        mappings:
          config.json: CONFIG_FILE_PATH
          settings.yaml: SETTINGS_FILE_PATH
    contexts:
      include:
        - deployment
        - all

  - type: StatefulSet
    name: e2e-statefulset
    namespace: enver-e2e-test
    contexts:
      include:
        - statefulset
        - all

  - type: DaemonSet
    name: e2e-daemonset
    namespace: enver-e2e-test
    contexts:
      include:
        - daemonset
        - all

  - type: Vars
    name: inline-vars
    vars:
      - name: INLINE_VAR1
        value: inline-value-1
      - name: INLINE_VAR2
        value: inline-value-2
    contexts:
      include:
        - all

  - type: EnvFile
    path: local.env
    contexts:
      include:
        - all

  - type: Container
    kind: Deployment
    name: e2e-container-test
    namespace: enver-e2e-test
    containers:
      - app
    files:
      - container: app
        path: /tmp/config.json
        output: container-files/config.json
        key: CONFIG_FILE_PATH
    variables:
      exclude:
        - KUBERNETES_.*
        - PATH
        - HOSTNAME
        - HOME
        - PWD
        - SHLVL
        - TERM
    contexts:
      include:
        - container
        - all

  # Test variable include filtering - only include CONFIG_* variables
  - type: ConfigMap
    name: e2e-configmap
    namespace: enver-e2e-test
    variables:
      include:
        - ^CONFIG_.*      # only include variables starting with CONFIG_
    contexts:
      include:
        - variable-filter

  # Test variable include + exclude combination
  - type: Secret
    name: e2e-secret
    namespace: enver-e2e-test
    variables:
      include:
        - ^SECRET_.*      # include SECRET_* variables
        - ENCODED_VALUE   # also include ENCODED_VALUE
      exclude:
        - SECRET_KEY2     # but exclude SECRET_KEY2
    contexts:
      include:
        - variable-filter

  # Source for output directory clear tests
  - type: ConfigMap
    name: e2e-configmap
    namespace: enver-e2e-test
    contexts:
      include:
        - clear-test
